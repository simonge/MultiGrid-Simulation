name: Build and smoke test MG

on:
  push:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Install CVMFS
        uses: cvmfs-contrib/github-action-cvmfs@v4

      - name: Verify CVMFS
        run: |
          ls /cvmfs
          cvmfs_config probe

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          source /cvmfs/sft.cern.ch/lcg/views/LCG_110/x86_64-ubuntu2604-gcc15-opt/setup.sh
          export G4PARTICLEHPDATA=/cvmfs/geant4.cern.ch/share/data/G4TENDL1.4
          ./setup.sh

      - name: Run 100-event smoke test
        shell: bash
        run: |
          set -euo pipefail
          source /cvmfs/sft.cern.ch/lcg/views/LCG_110/x86_64-ubuntu2604-gcc15-opt/setup.sh
          export G4PARTICLEHPDATA=/cvmfs/geant4.cern.ch/share/data/G4TENDL1.4
          output="${RUNNER_TEMP}/mg-ci-smoke.root"
          rm -f "${output}"
          ./build/MG --preset EMMAtest0 --output "${output}"
          test -s "${output}"

      - name: Render detector visualization directly to PDF
        shell: bash
        run: |
          set -euo pipefail
          source /cvmfs/sft.cern.ch/lcg/views/LCG_110/x86_64-ubuntu2604-gcc15-opt/setup.sh
          export G4PARTICLEHPDATA=/cvmfs/geant4.cern.ch/share/data/G4TENDL1.4
          rm -f detector-visualization.pdf
          ./build/MG --geometry macros/EMMAtest0.dat --macro macros/ci-visualization.mac
          test -s detector-visualization.pdf

      - name: Upload detector visualization PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mg-detector-visualization
          path: detector-visualization.pdf
          if-no-files-found: warn
